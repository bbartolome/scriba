# provisional: survey 22 §7 O1 (snake_case name; the spec's kebab-case name `numbers-to-people` stays in prose)
schemaVersion: 1
name: numbers_to_people
description: Turn one statistic into the story of one person behind it.
inputs:
  type: object
  properties:
    coreIdea:
      type: string
      title: Core idea
      description: The idea the passage serves, in one or two sentences.
      minLength: 1
      x-scriba-type: text
      x-scriba-port: true
    entityIds:
      type: array
      title: Entities
      description: Entities and sources to draw from, by ID.
      items:
        type: string
      uniqueItems: true
      x-scriba-type: entity
      x-scriba-port: true
    styleProfile:
      type: string
      title: Style profile
      description: One style profile entity, by ID.
      x-scriba-type: style
      x-scriba-port: true
    length:
      type: integer
      title: Length
      description: Target length in words.
      minimum: 1
      default: 800
    tone:
      type: string
      title: Tone
      description: Optional tone override for this passage.
      minLength: 1
    statistic:
      type: string
      title: Statistic
      description: The number to turn into a person, in one sentence.
      minLength: 1
      x-scriba-type: text
      x-scriba-port: true
    person:
      type: string
      title: Person
      description: The person behind the statistic, by ID.
      x-scriba-type: entity
      x-scriba-entity-kinds: [person]
      x-scriba-port: true
  required: [coreIdea, statistic, person]
  additionalProperties: false
output: draft
enabled: true
prompt: |
  You write one nonfiction passage that turns a statistic into the story of one person behind it, from the author's own material. Use no other source.

  Material. Each entity is shown with its ID and its path in parentheses.
  {{entity person}}
  {{#each entityIds}}
  {{entity this}}
  {{/each}}
  {{#if styleProfile}}Style profile, which sets the voice:
  {{entity styleProfile}}
  {{/if}}
  Core idea: {{coreIdea}}

  Shape, in this order:
  1. The statistic. State it in one plain sentence: {{statistic}}
  2. The person. Introduce the person above, and the one part of their story that the statistic stands for.
  3. The moment. Show that person at one concrete moment.
  4. The idea. Return from the person to the number and the core idea.

  Constraints:
  - Use only the material above. Add no fact, name, date, number or quote that it does not hold.
  - Cite each factual sentence with the ID of the entity or source it came from, in the form [@id]. Use only IDs shown above.
  - Where a fact you need is missing, write TK in its place. Do not guess.
  - Keep to the style profile's tone and banned phrases, when one is given.{{#if tone}} Tone for this passage: {{tone}}.{{/if}}
  - Aim for {{length}} words.
  - Reply with the passage only.
